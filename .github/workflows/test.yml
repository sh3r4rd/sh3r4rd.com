name: Test

# Frontend test pyramid: unit/integration (Vitest) + E2E (Playwright). Lint,
# build, Go tests, and Terraform validation live in ci.yml (which runs on the
# same triggers), so this workflow deliberately does NOT duplicate them.
# Triggers on pushes to main and on every pull request (so the Phase 5 epic's
# subtask PRs are checked too).
on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same ref. A distinct group from ci.yml so the
# two workflows don't cancel each other.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # unit-tests and e2e-tests are independent, so neither `needs` the other (nor
  # a lint gate) — they run in parallel and surface their results together.
  #
  # Both jobs are pinned to ubuntu-24.04 instead of ubuntu-latest. When
  # ubuntu-latest moved to Ubuntu 26.04, `npx playwright install --with-deps
  # chromium` started failing with "Playwright does not support chromium on
  # ubuntu26.04-x64". Unpin once the resolved @playwright/test version
  # supports the newer image. unit-tests is pinned too, so both jobs run on the
  # same image.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # $ImageOS (e.g. "ubuntu24") is set on GitHub-hosted runners but is not
      # exposed through the `env` context, so read it in a shell step.
      - name: Get runner image
        id: runner-image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      # Cache the Chromium download (the costly part) keyed on the runner image
      # and the resolved Playwright version, so an image change (e.g. 24.04 ->
      # 26.04) misses the cache instead of reusing browsers built for the old
      # image. On a hit, only the OS libraries are reinstalled.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (browser + OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          # A config error / early crash may leave no report; don't let a
          # missing path turn into a second failure that masks the real one.
          if-no-files-found: ignore
