[project]
name = "recruiter-evals"
version = "0.1.0"
description = "Evaluation harness, datasets and aggregate reports for Recruiter Intelligence (docs/recruiter-intelligence)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3[crt]>=1.40",  # crt: needed for the AWS CLI's `aws login` credentials
    "langdetect>=1.0.9",
    "tiktoken>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[project.scripts]
data-quality = "recruiter_evals.data_quality:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
